[package]
name = "debloatmail-feeds"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-tls", "json"] }
feed-rs = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
rusqlite = { workspace = true }
thiserror = { workspace = true }

debloatmail-core = { workspace = true }

debloatmail-store = { workspace = true }

tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
wiremock = "0.6"
