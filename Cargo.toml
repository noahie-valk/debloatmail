[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/extract",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
debloatmail-core = { path = "crates/core" }
debloatmail-store = { path = "crates/store" }
debloatmail-extract = { path = "crates/extract" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2.0.21"
mail-parser = "1.0.0"
charset = "0.1.5"
chardetng = "1.0.0"
html2text = "0.17"
