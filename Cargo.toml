[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/extract",
    "crates/feeds",
    "crates/auth",
    "crates/engine",
    "crates/sync",
    "crates/ffi",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
debloatmail-core = { path = "crates/core" }
debloatmail-store = { path = "crates/store" }
debloatmail-extract = { path = "crates/extract" }
debloatmail-feeds = { path = "crates/feeds" }
debloatmail-auth = { path = "crates/auth" }
debloatmail-engine = { path = "crates/engine" }
debloatmail-sync = { path = "crates/sync" }
debloatmail-ffi = { path = "crates/ffi" }
debloatmail-cli = { path = "crates/cli" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2.0.21"
mail-parser = "1.0.0"
charset = "0.1.5"
chardetng = "1.0.0"
html2text = "0.17"
io-imap = { version = "=0.7.1", default-features = false, features = ["scram", "client"] }
io-smtp = { version = "=0.6.0", default-features = false, features = ["scram", "client"] }
io-sasl = { version = "=0.1.0", default-features = false, features = ["scram", "saslprep"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
secrecy = "0.10.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"
rustls-platform-verifier = "0.7.1"
tokio-rustls = "0.26.6"
tokio = { version = "1.54.1", features = ["net", "io-util", "rt-multi-thread", "sync", "time", "macros"] }
blake3 = "1.8.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
zbus = "5.19.0"
libc = "0.2"
async-trait = "0.1.92"
tempfile = "3.27.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
base64 = "0.22.1"
clap = { version = "4.5.64", features = ["derive", "env"] }
clap_complete = "4.5.64"
clap_mangen = "0.2.33"
toml = "1.2.0"
anyhow = "1.0.104"
anstream = "1.0.0"
anstyle = "1.0.14"
rpassword = "7.5.4"
assert_cmd = "2.2.2"
predicates = "3.1.4"

